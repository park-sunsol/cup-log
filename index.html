<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Cup Log</title>
<style>
  :root {
    --bg: #FFFFFF;
    --glass: rgba(255,255,255,.72);
    --glass-strong: rgba(255,255,255,.9);
    --glass-edge: rgba(255,255,255,.85);
    --glass-shadow: 0 8px 32px rgba(60,50,80,.07), inset 0 1px 0 rgba(255,255,255,.95);
    --cell: rgba(255,255,255,.55);
    --tan: #9B8250;
    --tan-deep: #7E6A3F;
    --ink: #1F1B14;
    --muted: #7E7669;
    --line: rgba(31,27,20,.08);
    --heart: #E5484D;
    --blur: blur(22px) saturate(140%);
    --radius-xl: 30px;
    --radius-lg: 22px;
    --radius-md: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Pretendard", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; position: relative; overflow-x: hidden; background: var(--bg); background-image: linear-gradient(120deg, rgba(255,214,214,.22) 0%, rgba(255,236,204,.22) 20%, rgba(232,247,214,.22) 40%, rgba(212,240,248,.22) 60%, rgba(222,220,252,.22) 80%, rgba(250,220,244,.22) 100%); background-attachment: fixed; }
  /* ambient blobs behind the glass */
  .blob { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .18; pointer-events: none; z-index: -1; }
  .blob--a { width: 380px; height: 380px; top: -120px; left: -100px; background: #FFD6D6; }
  .blob--b { width: 320px; height: 320px; top: 40%; right: -140px; background: #D4F0F8; }
  .blob--c { width: 300px; height: 300px; bottom: -120px; left: 20%; background: #E8DCFC; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  img { display: block; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .glass { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); }

  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; }

  /* Header */
  .head { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 18px; }
  .head__title { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; height: 40px; display: flex; align-items: center; }
  .head__meta { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .head__meta:empty { display: none; }
  .monthnav { display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 2px; border-radius: 20px; align-self: flex-start; }
  .monthnav__btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 18px; }
  .monthnav__btn:active { background: var(--glass-strong); }
  .monthnav__label { padding: 0 12px; font-size: 14px; font-weight: 500; line-height: 40px; }

  /* Calendar */
  .cal { border-radius: var(--radius-xl); padding: 18px 14px 16px; }
  .cal__week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 8px; }
  .cal__week span { text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); }
  .cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cell { position: relative; aspect-ratio: 3/4; border-radius: 16px; background: var(--cell); border: 1px solid rgba(255,255,255,.6); display: grid; place-items: center; font-size: 15px; font-weight: 500; color: var(--ink); overflow: hidden; transition: transform .15s ease; }
  .cell:active { transform: scale(.94); }
  .cell--empty { background: transparent; border-color: transparent; pointer-events: none; }
  .cell--future { color: rgba(31,27,20,.25); }
  .cell--today { box-shadow: inset 0 0 0 1.5px rgba(31,27,20,.35); }
  .cell--selected { box-shadow: inset 0 0 0 2px var(--ink); }
  .cell--filled { background: var(--glass-strong); }
  .cell__img { width: 84%; height: 84%; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,.14)); }
  .cell__count { position: absolute; right: 4px; bottom: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; }

  /* Add button */
  .add { margin: 18px 0 28px; width: 100%; height: 60px; border-radius: 30px; background: var(--ink); border: 1px solid rgba(255,255,255,.15); box-shadow: 0 10px 28px rgba(31,27,20,.22), inset 0 1px 0 rgba(255,255,255,.12); color: #fff; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .12s ease; }
  .add:active { transform: scale(.98); background: #000; }
  .add__plus { font-size: 24px; font-weight: 400; line-height: 1; }

  /* Day list */
  .day__title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; padding: 0 4px 14px; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .empty { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; border-radius: var(--radius-lg); }
  .drink { border-radius: var(--radius-lg); padding: 16px; display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 14px; }
  .drink__img { width: 72px; height: 72px; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,.16)); }
  .drink__name { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .drink__brand { font-size: 12px; font-weight: 500; color: var(--tan); background: rgba(155,130,80,.12); padding: 2px 8px; border-radius: 999px; }
  .drink__sub { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .drink__right { text-align: right; }
  .drink__mg { font-size: 26px; font-weight: 600; color: var(--tan); line-height: 1; letter-spacing: -0.02em; }
  .drink__unit { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .drink__hearts { margin-top: 6px; font-size: 13px; letter-spacing: 1px; }
  .drink__del { grid-column: 1 / -1; justify-self: end; font-size: 12px; color: var(--muted); padding: 4px 8px; margin-top: -4px; }
  .drink__del:hover { color: var(--heart); }

  /* Sheet */
  .sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(31,27,20,.28); backdrop-filter: blur(6px); }
  .sheet__panel { width: 100%; max-width: 480px; max-height: 92dvh; background: rgba(255,255,255,.9); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--glass-edge); border-bottom: 0; border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; animation: rise .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet__panel { animation: none; } }
  .sheet__grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(31,27,20,.15); margin: 0 auto 16px; }
  .sheet__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet__title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .sheet__close { color: var(--muted); font-size: 15px; padding: 6px 4px; }

  /* Capture step */
  .capture { display: flex; flex-direction: column; gap: 14px; }
  .viewfinder { position: relative; aspect-ratio: 1; border-radius: var(--radius-lg); background: #1A1712; overflow: hidden; display: grid; place-items: center; }
  .viewfinder video { width: 100%; height: 100%; object-fit: cover; }
  .viewfinder__hint { color: rgba(255,255,255,.6); font-size: 13px; text-align: center; padding: 20px; line-height: 1.6; white-space: pre-line; }
  .viewfinder__guide { position: absolute; inset: 14%; border: 1.5px dashed rgba(255,255,255,.45); border-radius: 20px; pointer-events: none; }
  .shutter { align-self: center; width: 68px; height: 68px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(245,242,235,.9), 0 0 0 6px var(--ink); }
  .shutter:active { transform: scale(.92); }
  .shutter:disabled { opacity: .4; }
  .altrow { display: flex; justify-content: center; gap: 8px; }
  .chip { padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; }
  .chip:active { background: var(--glass-strong); }

  /* Process step */
  .process { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .preview { width: 100%; aspect-ratio: 1; border-radius: var(--radius-lg); background: rgba(255,255,255,.5); background-image: linear-gradient(45deg, rgba(31,27,20,.05) 25%, transparent 25%, transparent 75%, rgba(31,27,20,.05) 75%), linear-gradient(45deg, rgba(31,27,20,.05) 25%, transparent 25%, transparent 75%, rgba(31,27,20,.05) 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; display: grid; place-items: center; overflow: hidden; }
  .preview img { width: 100%; height: 100%; object-fit: contain; }
  .progress { width: 100%; height: 6px; border-radius: 3px; background: rgba(31,27,20,.1); overflow: hidden; }
  .progress__bar { height: 100%; width: 0; background: var(--ink); transition: width .2s ease; }
  .status { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; }
  .status--warn { color: #B5462E; }

  /* Form step */
  .form { display: flex; flex-direction: column; gap: 14px; }
  .form__hero { display: flex; align-items: center; gap: 14px; }
  .form__thumb { width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,.16)); }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .field__label { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .field__input { height: 48px; padding: 0 14px; border-radius: var(--radius-md); background: rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.8); font-size: 16px; width: 100%; }
  .field__input:focus { border-color: var(--ink); outline: none; background: rgba(255,255,255,.85); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; background: rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.8); border-radius: var(--radius-md); padding: 4px; }
  .seg__opt { flex: 1; height: 38px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .seg__opt--on { background: var(--ink); color: #fff; }
  .hearts { display: flex; gap: 6px; padding: 6px 4px; font-size: 26px; }
  .hearts__h { filter: grayscale(1) opacity(.35); transition: transform .1s; }
  .hearts__h--on { filter: none; }
  .hearts__h:active { transform: scale(1.2); }
  .save { height: 56px; border-radius: 28px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 600; margin-top: 6px; box-shadow: 0 8px 24px rgba(31,27,20,.2); }
  .save:active { background: #000; }
  .save:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="blob blob--a"></div><div class="blob blob--b"></div><div class="blob blob--c"></div>
<main class="app">
  <header class="head">
    <div>
      <h1 class="head__title" id="monthTitle">Sep</h1>
      <p class="head__meta" id="monthMeta"></p>
    </div>
    <nav class="monthnav glass" aria-label="Change month">
      <button class="monthnav__btn" id="prevMonth" aria-label="Previous month">‹</button>
      <span class="monthnav__label" id="monthLabel">Sep 2026</span>
      <button class="monthnav__btn" id="nextMonth" aria-label="Next month">›</button>
    </nav>
  </header>

  <section class="cal glass" aria-label="Monthly log">
    <div class="cal__week"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal__grid" id="grid"></div>
  </section>

  <button class="add" id="openAdd"><span class="add__plus">+</span> Add a Cup</button>

  <section class="day" aria-live="polite">
    <h2 class="day__title" id="dayTitle"></h2>
    <div class="list" id="list"></div>
  </section>
</main>

<!-- Bottom sheet -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__grip"></div>
    <div class="sheet__head">
      <h3 class="sheet__title" id="sheetTitle">Take a photo</h3>
      <button class="sheet__close" id="closeSheet">Close</button>
    </div>

    <!-- Step 1: capture -->
    <div class="capture" id="stepCapture">
      <div class="viewfinder" id="viewfinder">
        <video id="video" autoplay playsinline muted hidden></video>
        <p class="viewfinder__hint" id="camHint">Opening camera…</p>
        <div class="viewfinder__guide" hidden id="guide"></div>
      </div>
      <button class="shutter" id="shutter" aria-label="Capture" disabled></button>
      <div class="altrow">
        <label class="chip glass">Choose from library<input type="file" id="fileInput" accept="image/*" hidden></label>
        <label class="chip glass" id="mobileCamChip" hidden>Phone camera<input type="file" id="mobileCam" accept="image/*" capture="environment" hidden></label>
      </div>
    </div>

    <!-- Step 2: cutout -->
    <div class="process" id="stepProcess" hidden>
      <div class="preview"><img id="previewImg" alt="Drink preview"></div>
      <div class="progress"><div class="progress__bar" id="bar"></div></div>
      <p class="status" id="status">Cutting out the drink…</p>
      <div class="altrow">
        <button class="chip glass" id="retake">Retake</button>
        <button class="chip glass" id="useOriginal" hidden>Keep original</button>
      </div>
    </div>

    <!-- Step 3: details -->
    <form class="form" id="stepForm" hidden autocomplete="off">
      <div class="form__hero">
        <img class="form__thumb" id="formThumb" alt="">
        <div class="field">
          <label class="field__label" for="fName">Drink</label>
          <input class="field__input" id="fName" placeholder="Latte, Americano…" required>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label class="field__label" for="fBrand">Brand</label><input class="field__input" id="fBrand" placeholder="Starbucks"></div>
        <div class="field"><label class="field__label" for="fMg">Caffeine (mg)</label><input class="field__input" id="fMg" type="number" inputmode="numeric" placeholder="75"></div>
      </div>
      <div class="row2">
        <div class="field"><span class="field__label">Temperature</span>
          <div class="seg" id="segTemp"><button type="button" class="seg__opt seg__opt--on" data-v="hot">♨ Hot</button><button type="button" class="seg__opt" data-v="ice">🧊 Iced</button></div></div>
        <div class="field"><span class="field__label">Size</span>
          <div class="seg" id="segSize"><button type="button" class="seg__opt" data-v="S">S</button><button type="button" class="seg__opt seg__opt--on" data-v="M">M</button><button type="button" class="seg__opt" data-v="L">L</button></div></div>
      </div>
      <div class="row2">
        <div class="field"><label class="field__label" for="fDate">Date</label><input class="field__input" id="fDate" type="date" required></div>
        <div class="field"><label class="field__label" for="fTime">Time</label><input class="field__input" id="fTime" type="time" required></div>
      </div>
      <div class="field"><span class="field__label">Rating</span>
        <div class="hearts" id="hearts" role="radiogroup" aria-label="Rating"></div></div>
      <button class="save" id="saveBtn" type="submit">Save</button>
    </form>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ---------- storage (Supabase) ---------- */
const SUPABASE_URL = 'https://hubawygcjnenucljycfa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fvbpbzvJvjRC-5AlyAITWQ_ihZRr8sH';
const BUCKET = 'drink-images';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const dataURLtoBlob = async (dataURL) => (await fetch(dataURL)).blob();

const uploadImage = async (id, dataURL) => {
  if (!dataURL || !dataURL.startsWith('data:')) return dataURL; // already a URL
  const blob = await dataURLtoBlob(dataURL);
  const path = `${id}.png`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/png', upsert: true });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
};

const store = {
  all: async () => {
    const { data, error } = await sb.from('drinks').select('*').order('date', { ascending: true });
    if (error) throw error;
    return data;
  },
  put: async d => {
    d.img = await uploadImage(d.id, d.img);
    const { error } = await sb.from('drinks').upsert(d);
    if (error) throw error;
  },
  del: async id => {
    await sb.storage.from(BUCKET).remove([`${id}.png`]);
    const { error } = await sb.from('drinks').delete().eq('id', id);
    if (error) throw error;
  },
};

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const today = new Date();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let view = { y: today.getFullYear(), m: today.getMonth() };
let selected = iso(today);
let drinks = [];
let draft = { img: null, temp: 'hot', size: 'M', rating: 4 };
let stream = null;

/* ---------- render ---------- */
function render() {
  const { y, m } = view;
  $('monthTitle').textContent = MONTHS[m];
  $('monthLabel').textContent = `${MONTHS[m]} ${y}`;
  const inMonth = drinks.filter(d => d.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));
  const mg = inMonth.reduce((a, d) => a + (Number(d.caffeine) || 0), 0);
  $('monthMeta').textContent = inMonth.length ? `${inMonth.length} cups · ${mg.toLocaleString()} mg caffeine` : '';

  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const grid = $('grid'); grid.innerHTML = '';
  for (let i = 0; i < first; i++) grid.appendChild(Object.assign(document.createElement('div'), { className: 'cell cell--empty' }));
  for (let d = 1; d <= days; d++) {
    const key = iso(new Date(y, m, d));
    const list = drinks.filter(x => x.date === key);
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.setAttribute('aria-label', `${MONTHS[m]} ${d}, ${list.length} cups`);
    if (key === iso(today)) cell.classList.add('cell--today');
    if (key === selected) cell.classList.add('cell--selected');
    if (key > iso(today)) cell.classList.add('cell--future');
    if (list.length) {
      cell.classList.add('cell--filled');
      const img = new Image(); img.className = 'cell__img'; img.src = list[list.length-1].img; img.alt = list[0].name;
      cell.appendChild(img);
      if (list.length > 1) cell.appendChild(Object.assign(document.createElement('span'), { className: 'cell__count', textContent: list.length }));
    } else cell.textContent = d;
    cell.onclick = () => { selected = key; render(); };
    grid.appendChild(cell);
  }
  renderDay();
}

function renderDay() {
  const [y, m, d] = selected.split('-').map(Number);
  $('dayTitle').textContent = `${MONTHS[m-1]} ${d}`;
  const list = $('list'); list.innerHTML = '';
  const items = drinks.filter(x => x.date === selected).sort((a, b) => a.time.localeCompare(b.time));
  if (!items.length) {
    list.innerHTML = `<div class="empty glass">Nothing logged yet.<br>One photo is all it takes.</div>`;
    return;
  }
  for (const it of items) {
    const el = document.createElement('article'); el.className = 'drink glass';
    el.innerHTML = `
      <img class="drink__img" alt="">
      <div>
        <div class="drink__name"><span class="drink__brand" ${it.brand ? '' : 'hidden'}></span><span class="drink__label"></span><span>${it.temp === 'ice' ? '🧊' : '♨️'}</span></div>
        <div class="drink__sub"></div>
      </div>
      <div class="drink__right">
        <div class="drink__mg">${it.caffeine || 0}</div>
        <div class="drink__unit">mg</div>
        <div class="drink__hearts">${'❤️'.repeat(it.rating)}</div>
      </div>
      <button class="drink__del" type="button">Delete</button>`;
    el.querySelector('.drink__img').src = it.img;
    el.querySelector('.drink__brand').textContent = it.brand;
    el.querySelector('.drink__label').textContent = it.name;
    el.querySelector('.drink__sub').textContent = `${{S:'Small',M:'Medium',L:'Large'}[it.size]} · ${it.time}`;
    el.querySelector('.drink__del').onclick = async () => { if (confirm('Delete this cup?')) { await store.del(it.id); drinks = drinks.filter(x => x.id !== it.id); render(); } };
    list.appendChild(el);
  }
}

$('prevMonth').onclick = () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } render(); };
$('nextMonth').onclick = () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } render(); };

/* ---------- sheet & steps ---------- */
const steps = { capture: $('stepCapture'), process: $('stepProcess'), form: $('stepForm') };
function showStep(name) {
  for (const k in steps) steps[k].hidden = k !== name;
  $('sheetTitle').textContent = { capture: 'Take a photo', process: 'Keep only the drink', form: 'What was it?' }[name];
}
$('openAdd').onclick = () => { $('sheet').hidden = false; showStep('capture'); startCamera(); };
$('closeSheet').onclick = closeSheet;
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
function closeSheet() { stopCamera(); $('sheet').hidden = true; }

const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
$('mobileCamChip').hidden = !isMobile;

async function startCamera() {
  $('video').hidden = true; $('guide').hidden = true; $('shutter').disabled = true;
  $('camHint').hidden = false; $('camHint').textContent = 'Opening camera…';
  if (!navigator.mediaDevices?.getUserMedia) { $('camHint').textContent = 'Camera is not available here.\nChoose a photo from your library instead.'; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1280 } } });
    $('video').srcObject = stream; $('video').hidden = false; $('guide').hidden = false; $('camHint').hidden = true; $('shutter').disabled = false;
  } catch {
    $('camHint').textContent = 'Camera blocked. Allow access or open via localhost/https.\nOr choose a photo from your library.';
  }
}
function stopCamera() { stream?.getTracks().forEach(t => t.stop()); stream = null; }

$('shutter').onclick = () => {
  const v = $('video'), side = Math.min(v.videoWidth, v.videoHeight);
  const c = document.createElement('canvas'); c.width = c.height = side;
  c.getContext('2d').drawImage(v, (v.videoWidth-side)/2, (v.videoHeight-side)/2, side, side, 0, 0, side, side);
  c.toBlob(b => handlePhoto(b), 'image/jpeg', .92);
};
for (const id of ['fileInput', 'mobileCam']) $(id).onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) handlePhoto(f); };

/* ---------- background removal ---------- */
let removeBackground = null;
async function loadRemover() {
  if (removeBackground) return removeBackground;
  const mod = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm');
  removeBackground = mod.removeBackground; return removeBackground;
}
async function handlePhoto(blob) {
  stopCamera();
  const original = await downscale(blob, 1024);
  showStep('process');
  $('previewImg').src = original; $('bar').style.width = '0%';
  $('useOriginal').hidden = false; $('status').className = 'status';
  $('status').textContent = 'Cutting out the drink… The first run downloads the model, so it takes a moment.';
  draft.img = original;
  try {
    const rb = await loadRemover();
    const out = await rb(original, {
      progress: (key, cur, tot) => { if (tot) $('bar').style.width = `${Math.round(cur/tot*100)}%`; },
      output: { format: 'image/png', quality: .9 }
    });
    draft.img = await blobToDataURL(out);
    $('previewImg').src = draft.img; $('bar').style.width = '100%';
    $('status').textContent = 'Done.';
    setTimeout(openForm, 500);
  } catch (err) {
    console.error(err);
    $('status').className = 'status status--warn';
    $('status').textContent = 'Cutout failed. Check your connection, or keep the original.';
  }
}
$('useOriginal').onclick = openForm;
$('retake').onclick = () => { showStep('capture'); startCamera(); };

function downscale(blob, max) {
  return new Promise(res => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .9)); URL.revokeObjectURL(img.src);
    }; img.src = URL.createObjectURL(blob);
  });
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });

/* ---------- form ---------- */
function openForm() {
  showStep('form');
  $('formThumb').src = draft.img;
  $('fDate').value = selected;
  $('fTime').value = new Date().toTimeString().slice(0, 5);
  $('fName').value = ''; $('fBrand').value = ''; $('fMg').value = '';
  draft.temp = 'hot'; draft.size = 'M'; draft.rating = 4;
  syncSeg('segTemp', draft.temp); syncSeg('segSize', draft.size); renderHearts();
  $('fName').focus();
}
function syncSeg(id, v) { $(id).querySelectorAll('.seg__opt').forEach(b => b.classList.toggle('seg__opt--on', b.dataset.v === v)); }
$('segTemp').onclick = e => { const b = e.target.closest('.seg__opt'); if (b) { draft.temp = b.dataset.v; syncSeg('segTemp', draft.temp); } };
$('segSize').onclick = e => { const b = e.target.closest('.seg__opt'); if (b) { draft.size = b.dataset.v; syncSeg('segSize', draft.size); } };
function renderHearts() {
  const h = $('hearts'); h.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '❤️';
    b.className = 'hearts__h' + (i <= draft.rating ? ' hearts__h--on' : ''); b.setAttribute('aria-label', `${i} of 5`);
    b.onclick = () => { draft.rating = i; renderHearts(); };
    h.appendChild(b);
  }
}
$('stepForm').onsubmit = async e => {
  e.preventDefault();
  const d = { id: crypto.randomUUID(), img: draft.img, name: $('fName').value.trim(), brand: $('fBrand').value.trim(),
    caffeine: Number($('fMg').value) || 0, temp: draft.temp, size: draft.size, rating: draft.rating,
    date: $('fDate').value, time: $('fTime').value };
  await store.put(d); drinks.push(d); selected = d.date;
  view = { y: Number(d.date.slice(0,4)), m: Number(d.date.slice(5,7)) - 1 };
  closeSheet(); render();
};

/* ---------- init ---------- */
drinks = await store.all();
render();
</script>
</body>
</html>
